# KHUÔN — credential của NGƯỜI VẬN HÀNH (bạn + agent). Chỉ dùng trên máy local, KHÔNG BAO GIỜ lên VPS.
# `tools/lab run <nhóm> -- <lệnh>` bơm 1 nhóm vào biến môi trường: tên biến = đường dẫn key viết hoa nối "_".
github:
  token: "PASTE_GITHUB_PAT"            # -> GITHUB_TOKEN (+ GH_TOKEN)

cloudflare:
  api_token: "PASTE_CLOUDFLARE_TOKEN"  # -> CLOUDFLARE_API_TOKEN

# Thêm nhóm khác cùng kiểu: <tên>: { <key>: "..." }
